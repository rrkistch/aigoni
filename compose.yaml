name: aigoni

services:
  aigoni:
    image: ${AIGONI_IMAGE:-aigoni-firefly:local}
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - path: ${AIGONI_ENV_FILE:-./docker.env}
        format: raw
    environment:
      PORT: "8080"
      FIREFLY_SOURCE_DIR: /opt/firefly
      FIREFLY_BUILD_DIR: /data/.firefly
      FIREFLY_NODE: /usr/local/bin/node
    ports:
      - "${AIGONI_BIND_ADDRESS:-127.0.0.1}:${AIGONI_PORT:-8080}:8080"
    volumes:
      - data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
