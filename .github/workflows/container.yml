name: Container image

on:
  push:
    branches: [main]
    tags: ['container-v*']
    paths:
      - 'Dockerfile'
      - '*.go'
      - 'go.mod'
      - 'go.sum'
      - 'internal/**'
      - 'cmd/**'
      - 'frontend/**'
      - 'deploy/docker/**'
      - 'docs/openapi.yaml'
      - 'config.yaml.example'
      - '.env.example'
      - '.github/workflows/container.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-main
  cancel-in-progress: false

# Note: 发布移到 CI，服务器只拉取；见 docs/decisions/firefly-integration.md。
jobs:
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/container-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build Linux amd64 image (includes Go tests)
        if: ${{ !startsWith(github.ref, 'refs/tags/container-v') }}
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t aigoni-firefly:docker-smoke .
      - name: Reuse verified main candidate for release
        if: startsWith(github.ref, 'refs/tags/container-v')
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:sha-$GITHUB_SHA"
          docker pull "$IMAGE"
          test "$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          docker tag "$IMAGE" aigoni-firefly:docker-smoke
      - name: Download published portable theme for install verification
        run: |
          mkdir -p .theme-artifacts
          curl --fail --location --retry 3 --output .theme-artifacts/aigoni-theme-v0.1.2-linux-amd64.tar.gz \
            https://github.com/rrkistch/aigoni/releases/download/theme-v0.1.2/aigoni-theme-v0.1.2-linux-amd64.tar.gz
      - name: Verify healthcheck and real publishing
        if: ${{ !startsWith(github.ref, 'refs/tags/container-v') }}
        env:
          AIGONI_THEME_PACKAGE: .theme-artifacts/aigoni-theme-v0.1.2-linux-amd64.tar.gz
        run: |
          node --test deploy/docker/healthcheck.test.cjs
          node deploy/docker/smoke.cjs
      - name: Verify release migration, theme upgrade/rollback, MCP approval and recovery
        if: startsWith(github.ref, 'refs/tags/container-v')
        env:
          AIGONI_TEST_IMAGE: aigoni-firefly:docker-smoke
          AIGONI_MIGRATION_IMAGE: ghcr.io/rrkistch/aigoni:sha-a02b69fcd11d70856e69b04b3ad84abe231fe651
          AIGONI_THEME_PACKAGE: .theme-artifacts/aigoni-theme-v0.1.2-linux-amd64.tar.gz
          AIGONI_THEME_UPDATE_PACKAGE: .theme-artifacts/aigoni-theme-v0.3.0-linux-amd64.tar.gz
          AIGONI_MCP_SMOKE: '1'
        run: |
          curl --fail --location --retry 3 --output "$AIGONI_THEME_UPDATE_PACKAGE" \
            https://github.com/rrkistch/aigoni/releases/download/theme-v0.3.0/aigoni-theme-v0.3.0-linux-amd64.tar.gz
          docker pull "$AIGONI_MIGRATION_IMAGE"
          node --test deploy/docker/healthcheck.test.cjs
          node deploy/theme/smoke.cjs
      - name: Publish verified image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker tag aigoni-firefly:docker-smoke "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          # Main produces a traceable candidate. Only a versioned release advances latest.
          if [[ "$GITHUB_REF" == refs/tags/container-v* ]]; then
            VERSION="${GITHUB_REF_NAME#container-}"
            if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tag must be container-vMAJOR.MINOR.PATCH" >&2
              exit 1
            fi
            docker tag aigoni-firefly:docker-smoke "$IMAGE:$VERSION"
            docker push "$IMAGE:$VERSION"
            docker tag aigoni-firefly:docker-smoke "$IMAGE:latest"
            docker push "$IMAGE:latest"
            printf '\nRelease: `%s:%s` (also latest)\n' "$IMAGE" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '### Published candidate (linux/amd64)\n\n`%s:sha-%s`\n' \
            "$IMAGE" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
