<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>网站维护 · aigoni</title><style>
:root{color-scheme:light dark;--primary:#24ab83;--bg:#edf5f2;--card:#fff;--text:#20332c}*{box-sizing:border-box}body{margin:0;padding:5vh 1rem;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,sans-serif}main{max-width:760px;margin:auto}section{background:var(--card);border-radius:16px;padding:1.5rem;margin-bottom:1rem}h1{font-size:1.75rem;margin:0 0 .6rem}h2{font-size:1.15rem}p{margin:.5rem 0 1rem}button,input{font:inherit;padding:.65rem 1rem;border-radius:10px}button{border:0;background:var(--primary);color:white;cursor:pointer}button:disabled{opacity:.5;cursor:wait}input{width:100%;margin:.5rem 0 1rem;border:1px solid #819b90;background:var(--bg);color:inherit}a{color:var(--primary)}#message{white-space:pre-wrap;overflow-wrap:anywhere}.muted{opacity:.75}.row{padding:.8rem 0;border-bottom:1px solid #819b9040}label{display:block}[hidden]{display:none!important}@media(prefers-color-scheme:dark){:root{--bg:#0d1713;--card:#19251f;--text:#e6f0eb}}
</style></head><body><main><section><p class="muted">AIGONI · MAINTENANCE</p><h1>网站维护</h1><p>此入口不依赖主题文件。若数据恢复中断，可在这里恢复到一致状态。</p><a id="back" href="@@ADMIN@@">返回管理工作区</a></section><section id="login"><h2>管理员登录</h2><form id="login-form"><label for="password">管理员密码</label><input id="password" type="password" autocomplete="current-password" required><button>登录维护入口</button></form></section><section id="panel" hidden><h2>恢复状态</h2><p id="health"></p><button id="recover" hidden>恢复未完成的事务</button><button id="refresh">刷新状态</button><div id="tasks"></div></section><section id="theme-panel" hidden><h2>主题安装与恢复</h2><p id="theme-status"></p><p class="muted">下载本项目正式 Release 的 Linux amd64 主题包；最大 1 GiB。上传后先验证，点击启用才会构建和切换。</p><p><a href="https://github.com/rrkistch/aigoni/releases" target="_blank" rel="noreferrer">下载主题包 ↗</a></p><label for="theme-file">主题包</label><input id="theme-file" type="file" accept=".tar.gz"><progress id="theme-progress" max="100" value="0" hidden></progress><p id="theme-candidate"></p><button id="theme-enable" hidden>构建并启用候选主题</button> <button id="theme-retry" hidden>重新验证文件</button> <button id="theme-rollback" hidden>用上一主题重建当前内容</button> <button id="theme-cancel" hidden>取消主题切换</button> <button id="upload-cancel" hidden>取消上传或验证</button><p class="muted">升级或回退不会覆盖个人设置。构建失败仍保留上一成功公开版本；已撤回内容不会通过回退重新公开。</p></section><section id="message" role="status" hidden></section></main><script>
let csrf='';const base='/api/admin/v1';const message=document.getElementById('message');
function show(text){message.hidden=false;message.textContent=text;}
async function request(path,method='GET',body){const response=await fetch(base+path,{method,credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:body===undefined?undefined:JSON.stringify(body)});const result=await response.json();if(!response.ok)throw new Error(result.error?.message||'请求失败');return result;}
async function refresh(){try{const session=await request('/session');csrf=session.csrf_token;document.getElementById('login').hidden=true;document.getElementById('panel').hidden=false;const data=await request('/backups');document.getElementById('health').textContent=data.recovery_required?'上次恢复尚未完成，正常读写已暂停。请恢复一致状态后再返回网站。':'数据未处于待恢复状态。可以返回工作区继续管理。';document.getElementById('recover').hidden=!data.recovery_required;document.getElementById('back').hidden=data.recovery_required;const tasks=document.getElementById('tasks');tasks.replaceChildren();for(const task of data.items.slice(0,10)){const row=document.createElement('div');row.className='row';row.textContent=task.id+' · '+task.status+(task.error?' · '+task.error:'');tasks.append(row);}if(!data.recovery_required)await refreshTheme();}catch(error){show(error.message);document.getElementById('login').hidden=false;}}
document.getElementById('login-form').addEventListener('submit',async event=>{event.preventDefault();try{await request('/session','POST',{password:document.getElementById('password').value});document.getElementById('password').value='';await refresh();}catch(error){show(error.message);}});
document.getElementById('refresh').onclick=refresh;
document.getElementById('recover').onclick=async()=>{if(!confirm('恢复上次未完成的事务到一致状态？不会安装新的主题或修改凭据。'))return;try{const data=await request('/backups/recover','POST',{confirm:true});show(data.message);await refresh();}catch(error){show(error.message);}};
let theme=null;let themeUploading=false;
async function refreshTheme(){
 try{theme=await request('/theme');}catch{return;}
 document.getElementById('theme-panel').hidden=false;
 if(!theme.build.active){document.getElementById('back').hidden=true;document.getElementById('health').textContent='首次安装尚未完成，请在下方上传并启用官方主题包。成功上线后再返回管理工作区。';}else document.getElementById('back').hidden=false;
 document.getElementById('theme-status').textContent='当前：'+(theme.current||'原源码目录模式')+(theme.pending?' · 正在切换：'+theme.pending+' · '+theme.build.status:'');
 const upload=theme.upload;
 document.getElementById('theme-candidate').textContent=upload?upload.tag+' · '+upload.status+(upload.error?' · '+upload.error:''):'';
 document.getElementById('theme-file').disabled=!theme.supported||themeUploading||!!theme.pending||['verifying','cancelling'].includes(upload?.status);
 document.getElementById('theme-enable').hidden=upload?.status!=='ready'||theme.current===upload?.tag||!!theme.pending;
 document.getElementById('theme-retry').hidden=upload?.status!=='failed';
 document.getElementById('theme-rollback').hidden=!theme.previous||!!theme.pending;
 document.getElementById('theme-cancel').hidden=!theme.pending;
 document.getElementById('upload-cancel').hidden=!['uploading','verifying','cancelling'].includes(upload?.status);
}
document.getElementById('theme-file').onchange=async event=>{
 const file=event.target.files?.[0];if(!file)return;event.target.value='';
 const tag=file.name.match(/^aigoni-(theme-v[0-9]+\.[0-9]+\.[0-9]+)-linux-amd64\.tar\.gz$/)?.[1];
 if(!tag||file.size>1024**3){show('请选择本项目正式发布的 Linux amd64 主题包，最大 1 GiB。');return;}
 themeUploading=true;const progress=document.getElementById('theme-progress');progress.hidden=false;progress.value=0;
 const key='aigoni-maintenance-theme:'+file.name+':'+file.size+':'+file.lastModified;
 try{
  let upload;const id=sessionStorage.getItem(key);if(id){try{upload=await request('/theme/uploads/'+id);}catch{sessionStorage.removeItem(key);}}
  if(!upload){upload=await request('/theme/uploads','POST',{tag,name:file.name,size:file.size});sessionStorage.setItem(key,upload.id);}
  await refreshTheme();
  while(upload.offset<file.size){const end=Math.min(file.size,upload.offset+8*1024**2);const response=await fetch(base+'/theme/uploads/'+upload.id+'?offset='+upload.offset,{method:'PUT',credentials:'same-origin',headers:{'X-CSRF-Token':csrf,'Content-Type':'application/octet-stream'},body:file.slice(upload.offset,end)});const data=await response.json();if(!response.ok)throw new Error(data.error?.message||'上传失败');upload=data;progress.value=Math.round(upload.offset/file.size*100);}
  await request('/theme/uploads/'+upload.id+'/complete','POST');sessionStorage.removeItem(key);show('上传完成，正在验证来源；当前网站不变。');
 }catch(error){show(error.message+'；断线后可重新选择同一文件续传。');}finally{themeUploading=false;await refreshTheme();}
};
document.getElementById('theme-enable').onclick=async()=>{if(!confirm('使用候选主题构建当前内容和设置，成功后才切换？'))return;try{await request('/theme/activate','POST',{version:theme.upload.tag});await refreshTheme();}catch(error){show(error.message);}};
document.getElementById('theme-retry').onclick=async()=>{try{await request('/theme/uploads/'+theme.upload.id+'/complete','POST');await refreshTheme();}catch(error){show(error.message);}};
document.getElementById('theme-rollback').onclick=async()=>{if(!confirm('用上一主题重新构建当前内容？不会还原旧文章。'))return;try{await request('/theme/rollback','POST',{});await refreshTheme();}catch(error){show(error.message);}};
document.getElementById('theme-cancel').onclick=async()=>{try{await request('/theme/cancel','POST',{});await refreshTheme();}catch(error){show(error.message);}};
document.getElementById('upload-cancel').onclick=async()=>{try{await request('/theme/uploads/'+theme.upload.id,'DELETE');await refreshTheme();}catch(error){show(error.message);}};
setInterval(()=>{if(theme?.pending||['verifying','cancelling'].includes(theme?.upload?.status))void refreshTheme().catch(error=>show(error.message));},2000);
refresh();
</script></body></html>
